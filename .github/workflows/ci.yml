name: ci

on:
  push:
  pull_request:

jobs:
  build-and-smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: arm toolchain
        uses: carlosperate/arm-none-eabi-gcc-action@v1
        with:
          release: '13.2.Rel1'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: python deps
        run: pip install pycryptodome pyserial unicorn

      - name: build bootloader
        working-directory: tools
        run: python bl_build.py

      - name: unit tests (wire contract + emulator budgets)
        run: python -m unittest discover -s tests -v

      - name: image fits under the ratchet ceiling
        run: |
          size=$(wc -c < bootloader/bin/bootloader.bin)
          echo "bootloader.bin: $size bytes"
          test "$size" -lt 63488

      - name: unused peripheral drivers stay out of the image
        run: |
          # The Makefile force-lists every driverlib object; only --gc-sections keeps
          # uDMA and friends out. Nothing calls them, so a hit means the strip broke.
          nm=$(arm-none-eabi-nm --defined-only bootloader/bin/bootloader.axf)
          bad=$(echo "$nm" | grep -E ' [TtWw] (uDMA|USB|CAN|EMAC|EPI|LCD|QEI|PWM|SHAMD5|Hibernate|OneWire)' || true)
          if [ -n "$bad" ]; then
            echo "$bad"
            echo "ERROR: unused driverlib peripherals linked in; is --gc-sections still set?"
            exit 1
          fi
          echo "no unused peripheral drivers in the image"

      - name: host tools produce a valid protected image
        working-directory: tools
        run: |
          python - <<'PY'
          import struct, subprocess
          open("fw_ci.bin", "wb").write(bytes((i * 37 + 11) & 0xff for i in range(2048)))
          msg = "ci build"
          subprocess.check_call(["python", "fw_protect.py", "--infile", "fw_ci.bin",
              "--outfile", "fw_ci_protected.bin", "--version", "3", "--message", msg])
          blob = open("fw_ci_protected.bin", "rb").read()
          ver, size, mlen = struct.unpack("<HHH", blob[:6])
          assert len(blob) == 98 + size + mlen, (len(blob), size, mlen)
          assert ver == 3 and size == 2048 and mlen == len(msg) + 1
          print("protected image ok:", len(blob), "bytes")
          PY

      - name: emulation end-to-end (unicorn runs bootloader.bin)
        run: python tests/emu/drive_update.py

      - name: fault-injection regression (single-fault rollback must fail)
        run: python tests/emu/fault_rollback.py

      - name: fault-injection regression (single-fault commit must fail)
        run: python tests/emu/fault_commit.py
